plugins {
    id 'java'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
    id 'me.modmuss50.mod-publish-plugin' version '0.6.3'
}

version = "${version}-forge"
base.archivesName = mod_id

mixin {
    add(sourceSets.main, "${mod_id}.refmap.json")
    config("${mod_id}.mixins.json")
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformer = at
    }
    runs {
        client {
            workingDirectory project.file('run')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Client'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                modClientRun {
                    source sourceSets.main
                    source project(":common").sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Server'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                modServerRun {
                    source sourceSets.main
                    source project(":common").sourceSets.main
                }
            }
        }
        data {
            workingDirectory project.file('run')
            ideaModule "${rootProject.name}.${project.name}.main"
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            taskName 'Data'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                modDataRun {
                    source sourceSets.main
                    source project(":common").sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

repositories {
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    mavenCentral()
    // Camafy (net.camacraft.camafy:camafy) is published to the local maven
    mavenLocal()
    maven { url = 'https://maven.minecraftforge.net' }
    flatDir {
        dir 'libs'
    }
    maven {
        url = 'https://maven.valkyrienskies.org'
        // It serves Kotlin for Forge's metadata but not its -all jar, which then
        // fails to resolve: KFF comes from its own repository below.
        content { excludeGroup 'thedarkcolour' }
    }
    maven { url = 'https://thedarkcolour.github.io/KotlinForForge/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly project(":common")

    // Shared library: Valkyrien Skies, gravity, networking and config helpers.
    implementation fg.deobf("net.camacraft.camafy:camafy:${camafy_version}")

    implementation fg.deobf("thedarkcolour:kotlinforforge:4.11.0")
    // Dev runs only: the mod reaches VS solely through Camafy, so nothing compiles against it.
    // Core versions pinned to what that VS ships with (see its pom) for reproducible builds.
    runtimeOnly fg.deobf("org.valkyrienskies:valkyrienskies-120-forge:${forge_vs_version}")
    runtimeOnly "org.valkyrienskies.core:api:${forge_vs_core_version}"
    runtimeOnly "org.valkyrienskies.core:impl:${forge_vs_core_version}"
    runtimeOnly "org.valkyrienskies.core:util:${forge_vs_core_version}"
    implementation "org.joml:joml:1.10.5"
}

def resourceTargets = ['META-INF/mods.toml', 'pack.mcmeta']
def replaceProperties = [
        minecraft_version: minecraft_version, minecraft_version_range: forge_minecraft_version_range,
        forge_version: forge_version, forge_version_range: forge_version_range,
        camafy_version_range: camafy_version_range,
        loader_version_range: forge_loader_version_range,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: version,
        mod_author: mod_author, mod_description: mod_description,
        mod_url: mod_url, mod_issues: mod_issues, side: forge_side
]

processResources {
    inputs.properties replaceProperties
    filesMatching(resourceTargets) {
        expand replaceProperties
    }
    from project(":common").sourceSets.main.resources
    exclude '**/data/c/**', '**/data/fabric/**'
}

// ForgeGradle only chains reobfJar off assemble/build, so a bare :forge:jar
// (IDE builds included) would ship mojmap-named classes that crash in
// production on the first @Shadow. Finalizing jar keeps every jar reobfuscated.
jar.finalizedBy('reobfJar')

publishMods {
    file = jar.archiveFile
    displayName = "${mod_name} ${project.version}"
    type = STABLE
    modLoaders.addAll("forge", "neoforge")
    changelog = rootProject.file("CHANGELOG.md").text
    def gameVersions = ["1.20", "1.20.1"]

    // NOTE: set these to the fork's own project IDs before publishing.
    // The upstream Wall-Jump TXF IDs (CurseForge 909143 / Modrinth oUoetxfR)
    // were removed so a publish can never target the original mod's pages.
    curseforge {
        accessToken = System.getenv("CURSEFORGE_TOKEN")
        projectId = "REPLACE_WITH_YOUR_CURSEFORGE_PROJECT_ID"
        minecraftVersions.addAll(gameVersions)
    }

    modrinth {
        accessToken = System.getenv("MODRINTH_TOKEN")
        projectId = "REPLACE_WITH_YOUR_MODRINTH_PROJECT_ID"
        minecraftVersions.addAll(gameVersions)
    }
}

["publishCurseforge", "publishModrinth", "publishMods"].each { task ->
    tasks.named(task) {
        mustRunAfter(":fabric:$task")
    }
}